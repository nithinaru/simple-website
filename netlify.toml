[build]
  # build:ci skips the preview-screenshot fetch — those images are committed,
  # so the deploy never depends on a third-party API being up. Regenerate them
  # locally with `npm run prebuild` when you add an item.
  command = "npm run build:ci"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.20.0"

# netlify's next.js runtime handles ssr/isr and asset routing
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# hashed build assets are safe to cache forever
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
